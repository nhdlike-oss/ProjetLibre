<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miam Miam - Inscrire mon commerce</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="entete">
        <a href="index.html" class="logo">Miam Miam</a>
    </header>

    <main class="carte-auth">
        <h1>Inscrire mon commerce</h1>
        <p class="sous-titre">Une seule inscription : ensuite, vous publiez vos offres quand vous voulez.</p>

        <form id="formulaire-inscription">

            <fieldset>
                <legend>Votre commerce</legend>

                <p>
                    <label for="commerce">Nom du commerce</label>
                    <input type="text" id="commerce" name="commerce"
                           placeholder="Ex : Épicerie Chez Marie"
                           autocomplete="organization" required>
                </p>

                <p>
                    <label for="adresse">Adresse</label>
                    <input type="text" id="adresse" name="adresse"
                           placeholder="Numéro et rue"
                           autocomplete="street-address" required>
                </p>

                <p>
                    <label for="ville">Ville</label>
                    <input type="text" id="ville" name="ville"
                           autocomplete="address-level2" required>
                </p>

                <p>
                    <label for="code-postal">Code postal</label>
                    <input type="text" id="code-postal" name="code-postal"
                           pattern="[A-Za-z][0-9][A-Za-z] ?[0-9][A-Za-z][0-9]"
                           title="Exemple : G7H 2B1"
                           placeholder="G7H 2B1"
                           autocomplete="postal-code" required>
                </p>
            </fieldset>

            <fieldset>
                <legend>Votre compte</legend>

                <p>
                    <label for="courriel">Courriel</label>
                    <input type="email" id="courriel" name="courriel"
                           pattern="[^@\s]+@[^@\s]+\.[^@\s]+"
                           title="Exemple : commerce@exemple.com"
                           placeholder="commerce@exemple.com"
                           autocomplete="email" required>
                </p>
                <p id="courriel-message"></p>

                <p>
                    <label for="mdp">Mot de passe</label>
                    <input type="password" id="mdp" name="mdp"
                           pattern=".{8,}"
                           title="Au moins 8 caractères"
                           placeholder="Au moins 8 caractères"
                           autocomplete="new-password" required>
                </p>
                <p id="mdp-message"></p>

                <p>
                    <label for="mdp-confirm">Confirmer le mot de passe</label>
                    <input type="password" id="mdp-confirm" name="mdp-confirm"
                           pattern=".{8,}"
                           title="Au moins 8 caractères"
                           placeholder="Au moins 8 caractères"
                           autocomplete="new-password" required>
                </p>
                <p id="mdp-confirm-message"></p>
            </fieldset>

            <p>
                <label>
                    <input type="checkbox" id="consentement" name="consentement" required>
                    J'accepte les <a href="aide.html">conditions d'utilisation</a>
                    et je m'engage à publier uniquement des produits propres à la consommation.
                </label>
            </p>

            <p id="erreur-inscription" role="alert"></p>

            <p><button type="submit">Inscrire mon commerce</button></p>
        </form>

        <p>Déjà inscrit ? <a href="connexion.html">Se connecter</a></p>
        <p><a href="index.html">&larr; Retour aux offres</a></p>
    </main>

    <footer class="pied">
        <p>&copy; 2026 Miam Miam. Tous droits réservés.</p>
    </footer>

</body>
</html>
