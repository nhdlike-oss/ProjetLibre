<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miam Miam - Espace commerçant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="entete">
        <a href="index.html" class="logo">Miam Miam</a>
    </header>

    <main class="carte-auth">
        <h1>Espace commerçant</h1>
        <p class="sous-titre">Connectez-vous pour publier et gérer vos offres anti-gaspillage.</p>

        <form id="formulaire-connexion">
            <p>
                <label for="courriel">Courriel</label>
                <input type="email" id="courriel" name="courriel"
                       placeholder="commerce@exemple.com" autocomplete="email" required>
            </p>

            <p>
                <label for="mot-de-passe">Mot de passe</label>
                <input type="password" id="mot-de-passe" name="mot-de-passe"
                       autocomplete="current-password" required>
            </p>

            <p id="erreur-connexion" role="alert"></p>

            <p><button type="submit">Se connecter</button></p>
        </form>

        <p><a href="modifier_changer_mdp.html">Mot de passe oublié ?</a></p>
        <p>Votre commerce n'a pas encore de compte ? <a href="inscription.html">Inscrire mon commerce</a></p>
        <p><a href="index.html">&larr; Retour aux offres</a></p>
    </main>

    <footer class="pied">
        <p>&copy; 2026 Miam Miam. Tous droits réservés.</p>
    </footer>

</body>
</html>
