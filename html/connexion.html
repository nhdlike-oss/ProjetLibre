<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
         <title>Anti-gaspillage – Connexion</title>
    <link rel="stylesheet" href="../style.css">
    </head>
<body>
    
     <main class="auth" id="auth">
        <form  class="connexion" id="formConnexion">
            <h2>Connexion</h2>
            <label for="emailConnexion">Courriel </label>
            <input id="emailConnexion" name="email" type="email"placeholder="Courriel" required>
            <br>
            <label for="mdpConnexion">Mot de passe </label>
         <input id="mdpConnexion" name="mdpasse" type="password" placeholder="mot de passe" required>
        

          <label>
            <input type="checkbox" name="souvenir"> Se souvenir
        </label>
        <a href="mot_de_pass_oublier.html">Mot de passe oublier</a>
         <button type="submit">Se connecter</button>
         <a class="retour" href="../index.html">← Retour à l'accueil</a>
       
        </form>
    <form class= "enregistrer" id="forminscription">
        <h2>Inscription</h2>
           <label for="nom">nom</label>
            <input id="nom" name="nom" type="text"placeholder="nom" required>
           <label for="prenom">Prénom</label>
            <input id="prenom" name="prenom" type="text" placeholder="prénom" required>

            <label for="emailInscription">Courriel</label>
            <input id="emailInscription" name="email" type="email" placeholder="courriel" required>

            <label for="mdpInscription">Mot de passe</label>
            <input id="mdpInscription" name="motdepasse" type="password" placeholder="mot de passe" minlength="6" required>
  <label for="role">Je suis</label>
            <select id="role" name="role" required>
                <option value="commercant">Commerçant</option>
            </select>

            <button type="submit">S'inscrire</button>
        </form>
    </form>
    <aside class="bienvenue">
    <div class="panneau-inscrire">
        <h2>Bonjour, bienvenue !</h2>
        <p>Pas encore de compte ?</p>
        <button type="button" id="boutonInscrire">S'inscrire</button>
    </div>
    <div class="panneau-connexion">
        <h2>Re-bonjour !</h2>
        <p>Vous avez déjà un compte ?</p>
        <button type="button" id="boutonConnexion">Se connecter</button>
    </div>
   
</aside>
     </main>
        
    
</body>
</html>
