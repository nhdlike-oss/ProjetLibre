<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
        <title>Antigaspe</title>
        <link rel="stylesheet" href="style.css"
    </head>
<body>
    <h1>Connexion</h1>
    <p>J'ai deja un compte</p>
     <main class="auth" id="auth">
        <form  class="Connexion">
            <h2>Connexion</h2>
            <input placeholder="nomuser">
            <br>
         <input type="password" placeholder="mot de passe">
         <button>Se connecter</button>

        </form>
    <form class= "enregistrer">
        <h2>Inscription</h2>

            <input placeholder="nom">
            <br>
             <input placeholder="prenom">
            <br>
             <input placeholder="email">
            <br>
         <input type="password" placeholder="mot de passe">
         <button>S'inscrire</button>
    </form>
    <aside class="bienvenue">
    <div class="panneau-inscrire">
        <h2>Bonjour, bienvenue !</h2>
        <p>Pas encore de compte ?</p>
        <button type="button" id="btnInscrire">S'inscrire</button>
    </div>
    <div class="panneau-connexion">
        <h2>Re-bonjour !</h2>
        <p>Vous avez déjà un compte ?</p>
        <button type="button" id="btnConnexion">Se connecter</button>
    </div>
</aside>
     </main>
        
    
</body>
</html>
